name: FacePrintPay Standard Deploy
on:
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and Verify
        run: |
          if [ -f package.json ]; then npm install && npm run build --if-present; fi
          echo "Sovereign build completed successfully."
